 <!-- Header -->
<header class="header">
  <h1>Cadastro de Cartões</h1>

  <div class="user-area">
    <span class = "user-name">Olá, Usuário</span>
    <i class="fa-solid fa-circle-user"></i>
  </div>
</header>

<!-- Conteúdo -->
<main class="content">
  <div class="card">
    <h2>Novo Cartão</h2>

    <form [formGroup]="form" (ngSubmit)="handleSubmit()" class="form">
      <!-- Corrigido: form-group -->
      <div class="form-group">
        <label for="nome">Nome do Cartão *</label>
        <input formControlName="nome" type="text" 
               id="nome" 
               name="nome" 
               placeholder="Ex: Nubank" />
      </div>

      <!-- Corrigido: form-group -->
      <div class="form-group">
        <label for="bandeira">Bandeira: *</label>
        <select formControlName="bandeira" id="bandeira" name="bandeira">
          <option value="">Selecione ...</option>
          <option value="VISA">Visa</option>
          <option value="MASTERCARD">Mastercard</option>
          <option value="AMERICAN_EXPRESS">American Express</option>
          <option value="DINNER">Dinner</option>
          <option value="ELO">Elo</option>
        </select>
      </div>

      <div class="form-action">
        <button type="submit" class="btn-primary">Salvar</button>
        <button type="button" class="btn-secondary">Cancelar</button>
      </div>
    </form>
  </div>
</main>
